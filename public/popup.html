<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Correo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap');
  :root {
    --bg: #f2f2f3;
    --text: #1d1f20;
    --accent: #5980a6;
    --accent-600: #597ea3;
    --accent-700: #416180;
    --accent-100: #eef6ff;
    --divider: color-mix(in srgb, #1d1f20 16%, transparent);
    --neutral-600: #7a7a7d;
    --neutral-700: #5d5d60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 280px;
    background: var(--bg);
    color: var(--text);
    font-family: "Barlow", system-ui, sans-serif;
    font-size: 13px;
  }
  .head {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand {
    width: 26px;
    height: 26px;
    background: var(--accent);
    color: var(--bg);
    font-family: "Barlow Condensed", sans-serif;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .head-title {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 18px;
    margin-right: auto;
  }
  .icon-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .icon-btn svg { display: block; }
  .icon-btn.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .plate {
    margin: 0 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--divider);
  }
  .plate button {
    all: unset;
    cursor: pointer;
    box-sizing: border-box;
    padding: 10px;
    border-right: 1px solid var(--divider);
  }
  .plate button:last-child { border-right: none; }
  .plate button.accent { background: var(--accent); color: var(--bg); }
  .plate-n {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 36px;
    font-weight: 600;
    line-height: 1;
    display: block;
  }
  .plate-label { font-size: 12px; }

  .oldest {
    padding: 10px 12px 2px;
    display: flex;
    flex-direction: column;
  }
  .oldest-title {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--neutral-700);
    padding-bottom: 4px;
  }
  .oldest-row {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--divider);
    font-size: 13px;
    cursor: pointer;
  }
  .oldest-row:last-child { border-bottom: none; }
  .oldest-dtag {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    color: var(--accent-700);
    width: 32px;
    flex: none;
  }
  .oldest-subject {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .empty-hint {
    padding: 10px 12px;
    color: var(--neutral-600);
    font-size: 12px;
  }

  .actions {
    padding: 10px 12px 12px;
    display: flex;
    gap: 6px;
  }
  .btn {
    all: unset;
    cursor: pointer;
    box-sizing: border-box;
    flex: 1;
    text-align: center;
    padding: 8px 10px;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: 1px solid var(--divider);
  }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-600); }
  .btn.secondary:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }

  .msg {
    margin: 0 12px 10px;
    font-size: 12px;
    color: var(--accent-700);
    background: var(--accent-100);
    padding: 6px 8px;
  }

  .foot {
    padding: 8px 12px;
    border-top: 1px solid var(--divider);
    font-size: 11px;
    color: var(--neutral-600);
  }

  .connect-wrap {
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .connect-title {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 20px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
